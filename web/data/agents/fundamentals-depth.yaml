schema_version: 1
kind: agent
agent:
  id: fundamentals-depth
  name: Fundamentals - Foundational Knowledge
  version: 1
  domain: software-engineering-fundamentals
  objective: Establish breadth and clear foundational knowledge without relying on memorized
    definitions.
  opening: Pick one technology central to your role and explain one foundational concept
    from it in your own words.
  config:
    claim_handling: conceptual
    context:
      mode: none
      required: false
    scenario: {}
    tools: []
    actions:
      allowed:
      - ask_exact_example
      - ask_reflective_walkthrough
      - request_justification
      - isolate_missing_part
      - scaffold_missing_link
      - surface_contradiction
      - narrow_hint
      - deepen_with_tradeoff
      - deepen_with_edge_case
      - redirect_role
      - probe_required_evidence
      - transition_phase
      - close_session
      default: probe_required_evidence
      max_probes_per_lane: 2
    evidence:
      statuses:
      - untested
      - partial
      - sufficient
      - weak
      - unresolved
    turns:
      maximum: 8
    rendering:
      maximum_words: 45
      maximum_question_marks: 1
      one_focal_ask: true
      deterministic_closing: true
  stages:
  - id: fundamental-knowledge
    name: 'Round 1: Fundamental Knowledge'
    objective: Establish breadth and clear foundational knowledge without relying on
      memorized definitions.
    opening: Begin with a basic role-relevant concept and follow the answer into adjacent
      fundamentals.
    config:
      knowledge:
        tags:
        - fundamentals
        - execution-flow
      claim_handling: conceptual
      context:
        mode: none
      evidence:
        definitions:
          foundational_explanation: A clear and correct explanation in the candidate's
            own words.
          execution_flow: A coherent step-by-step account of what happens in the system.
          concrete_example: A specific practical example demonstrating the concept.
          foundational_breadth: Correct connections to adjacent role-relevant fundamentals.
        keys:
        - foundational_explanation
        - execution_flow
        - concrete_example
        - foundational_breadth
        completion_keys:
        - foundational_explanation
        - execution_flow
        - concrete_example
      turns:
        minimum: 3
        maximum: 5
