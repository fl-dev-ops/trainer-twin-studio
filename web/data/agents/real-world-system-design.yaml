schema_version: 1
kind: agent
agent:
  id: real-world-system-design
  name: System Design - Problem Understanding
  version: 1
  domain: software-engineering-system-design
  objective: Determine whether the candidate discovers the problem, constraints, assumptions,
    and scope before designing.
  opening: Design a system that allows users to upload and securely share large files;
    start by clarifying the problem rather than proposing architecture.
  config:
    claim_handling: hypothetical_design
    context:
      mode: scenario_only
      required: false
    scenario:
      problem: Users upload and securely share large files.
      reveal_policy: requested_facts_only
      hidden_requirements:
        users: Authenticated business users share internally or through expiring external
          links.
        file_size: Files can be as large as 20 GB.
        scale: One million daily active users and about 100,000 uploads per day with
          bursty global traffic.
        resumability: Uploads resume after network interruption.
        access: Files are private by default; owners control recipients and link expiry.
        retention: Default 30 days, configurable by the owning organisation.
        progress: Clients need accurate upload progress.
        security: Encrypt in transit and at rest, authorize access, and scan uploads
          for malware.
        availability: Downloads survive one application-server failure.
    tools: []
    actions:
      allowed:
      - ask_exact_example
      - ask_reflective_walkthrough
      - request_justification
      - reveal_requirement
      - isolate_missing_part
      - scaffold_missing_link
      - surface_contradiction
      - narrow_hint
      - deepen_with_tradeoff
      - deepen_with_edge_case
      - redirect_role
      - probe_required_evidence
      - transition_phase
      - close_session
      default: probe_required_evidence
      max_probes_per_lane: 2
    evidence:
      statuses:
      - untested
      - partial
      - sufficient
      - weak
      - unresolved
    turns:
      maximum: 8
    rendering:
      maximum_words: 45
      maximum_question_marks: 1
      one_focal_ask: true
      deterministic_closing: true
  stages:
  - id: problem-understanding
    name: 'Round 1: Problem Understanding & Requirement Gathering'
    objective: Determine whether the candidate discovers the problem, constraints,
      assumptions, and scope before designing.
    opening: Reveal requirements only in response to relevant questions; do not provide
      the complete problem upfront.
    config:
      knowledge:
        tags:
        - requirements
        - estimation
      claim_handling: hypothetical_design
      context:
        mode: scenario_only
      scenario:
        reveal_policy: requested_facts_only
      actions:
        allowed:
        - ask_exact_example
        - reveal_requirement
        - isolate_missing_part
        - narrow_hint
        - probe_required_evidence
        - transition_phase
        - close_session
      evidence:
        definitions:
          clarifying_questions: Relevant questions about users, data, security, traffic,
            and constraints.
          functional_requirements: A clear statement of what users and the system can
            do.
          nonfunctional_requirements: Reliability, latency, durability, availability,
            and security expectations.
          scale_constraints: Concrete facts or estimates about users, traffic, throughput,
            and geography.
          assumptions_scope: Explicit assumptions plus what is in and out of scope.
          problem_decomposition: A breakdown of workflows, requirement groups, risks,
            and unknowns without implementation.
        keys:
        - clarifying_questions
        - functional_requirements
        - nonfunctional_requirements
        - scale_constraints
        - assumptions_scope
        - problem_decomposition
        completion_keys:
        - clarifying_questions
        - functional_requirements
        - nonfunctional_requirements
        - assumptions_scope
      turns:
        minimum: 4
        maximum: 6
      rendering:
        forbidden_terms:
        - architecture
        - component
        - database
        - cache
        - queue
        - API
        - implementation
