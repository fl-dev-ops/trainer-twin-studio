schema_version: 1
kind: agent
agent:
  id: real-world-system-design
  name: Real-World Problem Solving & System Design
  version: 1
  domain: software-engineering-system-design
  objective: Evaluate how the candidate clarifies an ambiguous problem, builds a coherent
    solution, and adapts it under scale, failures, and changing constraints.
  opening: Design a system that allows users to upload and securely share large files;
    start by clarifying the problem rather than proposing architecture.
  config:
    claim_handling: hypothetical_design
    context:
      mode: none
      required: false
    scenario:
      problem: Users upload and securely share large files.
      reveal_policy: requested_facts_only
      hidden_requirements:
        users: Authenticated business users share internally or through expiring external
          links.
        file_size: Files can be as large as 20 GB.
        scale: One million daily active users and about 100,000 uploads per day with
          bursty global traffic.
        resumability: Uploads resume after network interruption.
        access: Files are private by default; owners control recipients and link expiry.
        retention: Default 30 days, configurable by the owning organisation.
        progress: Clients need accurate upload progress.
        security: Encrypt in transit and at rest, authorize access, and scan uploads
          for malware.
        availability: Downloads survive one application-server failure.
    tools: []
    actions:
      allowed:
      - ask_exact_example
      - ask_reflective_walkthrough
      - request_justification
      - reveal_requirement
      - isolate_missing_part
      - scaffold_missing_link
      - surface_contradiction
      - narrow_hint
      - deepen_with_tradeoff
      - deepen_with_edge_case
      - redirect_role
      - probe_required_evidence
      - transition_phase
      - close_session
      default: probe_required_evidence
      max_probes_per_lane: 2
    evidence:
      statuses:
      - untested
      - partial
      - sufficient
      - weak
      - unresolved
    turns:
      maximum: 20
    rendering:
      maximum_words: 45
      maximum_question_marks: 1
      one_focal_ask: true
      deterministic_closing: true
  stages:
  - id: problem-understanding
    name: 'Round 1: Problem Understanding & Requirement Gathering'
    objective: Determine whether the candidate discovers the problem, constraints,
      assumptions, and scope before designing.
    opening: Reveal requirements only in response to relevant questions; do not provide
      the complete problem upfront.
    config:
      knowledge:
        tags:
        - requirements
        - estimation
      claim_handling: hypothetical_design
      context:
        mode: scenario_only
      scenario:
        reveal_policy: requested_facts_only
      actions:
        allowed:
        - ask_exact_example
        - reveal_requirement
        - isolate_missing_part
        - narrow_hint
        - probe_required_evidence
        - transition_phase
        - close_session
      evidence:
        definitions:
          clarifying_questions: Relevant questions about users, data, security, traffic,
            and constraints.
          functional_requirements: A clear statement of what users and the system
            can do.
          nonfunctional_requirements: Reliability, latency, durability, availability,
            and security expectations.
          scale_constraints: Concrete facts or estimates about users, traffic, throughput,
            and geography.
          assumptions_scope: Explicit assumptions plus what is in and out of scope.
          problem_decomposition: A breakdown of workflows, requirement groups, risks,
            and unknowns without implementation.
        keys:
        - clarifying_questions
        - functional_requirements
        - nonfunctional_requirements
        - scale_constraints
        - assumptions_scope
        - problem_decomposition
        completion_keys:
        - clarifying_questions
        - functional_requirements
        - nonfunctional_requirements
        - assumptions_scope
      turns:
        minimum: 4
        maximum: 6
      rendering:
        forbidden_terms:
        - architecture
        - component
        - database
        - cache
        - queue
        - API
        - implementation
  - id: solution-development
    name: 'Round 2: System Design & Solution Development'
    objective: Build and justify a coherent end-to-end design from established requirements.
    opening: Ask for a high-level architecture, then progressively deepen the same
      design.
    config:
      knowledge:
        tags:
        - architecture
        - storage
        - security
        - reliability
      claim_handling: hypothetical_design
      context:
        mode: scenario_only
      evidence:
        definitions:
          system_architecture: Major components and responsibilities forming a plausible
            architecture.
          end_to_end_flow: Coherent upload, processing, sharing, and download flow.
          interface_and_storage: Justified API, data model, metadata, and object-storage
            choices.
          reliability_security: Error handling, authorization, integrity, resumability,
            and failure behavior.
          technology_reasoning: Why major choices fit constraints and what alternatives
            existed.
          design_coherence: Components connect into one implementable system.
        keys:
        - system_architecture
        - end_to_end_flow
        - interface_and_storage
        - reliability_security
        - technology_reasoning
        - design_coherence
        completion_keys:
        - system_architecture
        - end_to_end_flow
        - reliability_security
        - technology_reasoning
        - design_coherence
      turns:
        minimum: 5
        maximum: 7
  - id: scale-and-tradeoffs
    name: 'Round 3: Scale, Trade-offs & Real-World Challenges'
    objective: Challenge the design with scale, bottlenecks, failures, cost, security,
      and changed constraints.
    opening: Introduce one changed constraint at a time and require the candidate
      to evolve the existing design.
    config:
      knowledge:
        tags:
        - scalability
        - failures
        - observability
        - cost
      claim_handling: hypothetical_design
      context:
        mode: scenario_only
      evidence:
        definitions:
          bottleneck_prediction: A reasoned prediction of what breaks first.
          diagnostic_approach: Metrics, traces, tests, or observations used to locate
            the problem.
          scale_adaptation: A concrete evolution of the existing architecture.
          failure_recovery: Detection, containment, and recovery for a degraded component.
          adaptation_tradeoff: New costs, complexity, consistency choices, or risks.
          observability: Signals that drive diagnosis and action.
          deliberate_nonoptimization: A justified choice about what not to optimize
            yet.
        keys:
        - bottleneck_prediction
        - diagnostic_approach
        - scale_adaptation
        - failure_recovery
        - adaptation_tradeoff
        - observability
        - deliberate_nonoptimization
        completion_keys:
        - bottleneck_prediction
        - diagnostic_approach
        - scale_adaptation
        - failure_recovery
        - adaptation_tradeoff
      turns:
        minimum: 5
        maximum: 7
