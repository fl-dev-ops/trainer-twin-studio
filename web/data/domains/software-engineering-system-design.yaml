schema_version: 1
kind: domain
domain:
  id: software-engineering-system-design
  name: Software Engineering System Design
  version: 1
  principles:
  - Evaluate clarification and reasoning, not resemblance to a canonical diagram.
  - Require requirements before architecture.
  - Prefer coherent flows over disconnected technology lists.
  - Introduce one changed constraint at a time.
  - Treat hypothetical failures and adaptations as valid design evidence.
  - Require explicit costs and trade-offs for every adaptation.
  classifications:
    strong: The design claim is coherent, constraint-aware, and technically reasoned.
    partial: The direction is plausible but misses an important dependency or trade-off.
    vague: Lists technologies without responsibilities or data flow.
    unsupported: Makes a feasibility claim without mechanism or reasoning.
    contradictory: Conflicts with an earlier requirement or design decision.
    unknown: The candidate clearly cannot continue the design reasoning.
    role_violation: The candidate leaves the assigned design role.
