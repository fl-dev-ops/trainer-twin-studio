# Client role-play seed data: the persona library shown as avatar cards in the
# role-play builder, plus the first two role-play scenarios.
# Imported per organization with: bun scripts/import-roleplay.ts --org <slug> [--apply]
# Voices point at the shared sample voices until real ones are linked in the dashboard.

