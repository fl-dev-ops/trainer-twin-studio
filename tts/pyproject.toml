[project]
name = "trainertwin-tts"
version = "0.2.0"
description = "TrainerTwin TTS proxy — voice resolution + auth in front of vLLM-Omni/VoxCPM2"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
