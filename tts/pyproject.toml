[project]
name = "trainertwin-tts"
version = "0.1.0"
description = "VoxCPM2 zero-shot voice-cloning TTS service for TrainerTwin"
requires-python = ">=3.10,<3.13"
dependencies = [
    "voxcpm>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# torch/cuda wheels come in via voxcpm's dependencies; if the default index
# resolves to CPU-only torch on your host, uncomment:
# [tool.uv.sources]
# torch = { index = "pytorch-cu124" }
# [[tool.uv.index]]
# name = "pytorch-cu124"
# url = "https://download.pytorch.org/whl/cu124"
