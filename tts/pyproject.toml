[project]
name = "trainertwin-tts"
version = "0.2.2"
description = "TrainerTwin TTS proxy — voice resolution + auth in front of vLLM-Omni/VoxCPM2"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pysbd>=0.3.4,<0.4",
    "spacy>=3.8,<4",
    "en-core-web-sm",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--capture=tee-sys --durations=0"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
