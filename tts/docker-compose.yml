services:
  # GPU model server — VoxCPM2 via vLLM-Omni, continuous batching.
  # Cold start ~60s (model load + torch.compile + CUDA-graph warmup).
  tts-backend:
    image: trainertwin/tts-backend:0.28.0-speaker-cache
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    command: >
      vllm serve openbmb/VoxCPM2 --omni
      --host 0.0.0.0 --port 8001
      --deploy-config /srv/tts/deploy/voxcpm2.yaml
      --revision ${VOXCPM_MODEL_REVISION:-7936080b41163874f38610f46f438e2c0757f9fd}
    volumes:
      - ./deploy:/srv/tts/deploy:ro
      - ${TTS_PROFILE_SOURCE:-./voices}:/srv/tts/voices:ro
      - hf-cache:/root/.cache/huggingface   # weights survive restarts (~5 GB)
      - speakers:/srv/tts/speakers          # runtime-registered voices survive restarts
    environment:
      - HF_TOKEN=${HF_TOKEN:-}              # only if the model needs auth
      - SPEAKER_SAMPLES_DIR=/srv/tts/speakers
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 10

  # Voice resolution + auth proxy — the OpenAI-compatible endpoint clients use.
  tts-proxy:
    image: devopsfl/tts-voxcpm2:0.3.0
    restart: unless-stopped
    build: .  # local development; production pulls the image above
    ports:
      - "8000:8000"
    environment:
      - APP_BASE_URL=${APP_BASE_URL}
      - APP_API_KEY=${APP_API_KEY}
      - TTS_BACKEND_URL=http://tts-backend:8001
      - TTS_API_KEY=${TTS_API_KEY:?Set a strong TTS_API_KEY for the public proxy}
      - TTS_CUSTOM_VOICE_DIR=/srv/tts/voices
      - VOXCPM_MODEL_REVISION=${VOXCPM_MODEL_REVISION:-7936080b41163874f38610f46f438e2c0757f9fd}
    volumes:
      - ${TTS_PROFILE_SOURCE:-./voices}:/srv/tts/voices:ro
    depends_on:
      tts-backend:
        condition: service_healthy

volumes:
  hf-cache:
  speakers:
