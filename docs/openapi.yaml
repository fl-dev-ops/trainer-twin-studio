openapi: 3.1.0
info:
  title: TrainerTwin API
  version: 1.0.0
  description: |
    Organization-scoped API for managing learners, practice sessions, and role-play assignments.
    The API covers role plays only; twins are not listed or returned. Sessions are read-only:
    practice happens in the TrainerTwin app.
    Scenarios can be listed via the API; scenario, persona, knowledge, and voice
    configuration remains dashboard-only.
servers:
  - url: https://dash.trainertwin.com/api/v1
    description: Production
security:
  - ApiKeyAuth: []
tags:
  - name: Users
    description: Invite and manage organization learners.
  - name: Assignments
    description: Give learners published scenarios to practise, as often as their credits allow.
  - name: Scenarios
    description: Read the organization's published role-play scenarios.
  - name: Sessions
    description: Read practice sessions and their results (read-only).
paths:
  /scenarios:
    get:
      operationId: listScenarios
      tags: [Scenarios]
      summary: List scenarios
      description: Lists the organization's published role-play scenarios in dashboard order (`order` ascending, newest first within the same order). Archived scenarios are not listed.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Organization scenarios.
          content:
            application/json:
              schema:
                type: object
                required: [scenarios, pagination]
                properties:
                  scenarios:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScenarioSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /scenarios/{scenarioSlug}:
    parameters:
      - $ref: '#/components/parameters/ScenarioSlug'
    get:
      operationId: getScenario
      tags: [Scenarios]
      summary: Get a scenario
      description: Returns one published scenario including its role-play configuration (`data`). The data payload is dashboard-controlled and may gain fields at any time. Archived scenarios return `404`.
      responses:
        '200':
          description: Scenario details.
          content:
            application/json:
              schema:
                type: object
                required: [scenario]
                properties:
                  scenario:
                    $ref: '#/components/schemas/ScenarioDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List learners
      description: Lists the learners in the API key's organization, newest first. `limit` and `offset` page through `users`. Learners are added straight to the organization, so there are no pending invitations; `invitations` is always empty and kept for older integrations.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Learners.
          content:
            application/json:
              schema:
                type: object
                required: [users, invitations, pagination]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  invitations:
                    type: array
                    maxItems: 0
                    description: Always empty (kept for older integrations).
                    items: {}
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: inviteUser
      tags: [Users]
      summary: Add a learner
      description: |
        Adds the email to the organization as a learner right away (creating their TrainerTwin account if needed) and
        emails them that they were added, with a link to the organization's home page, where they sign in with Google
        or an email code. Email failure does not undo the add. Adding someone who is already a learner changes nothing
        and returns `200`. Assigning a role play by email adds the learner the same way, so this call is optional.
        A new learner gets 30 credits (1 credit = 1 minute of practice) from the organization's prepaid balance (once).
        Returns `409` when the balance can't cover them, or when the email belongs to a trainer (admin or team) or a
        disabled learner of the organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
                  example: learner@example.com
      responses:
        '201':
          description: Learner added.
          content:
            application/json:
              schema:
                type: object
                required: [user, created, emailSent]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  created:
                    type: boolean
                    const: true
                  emailSent:
                    type: boolean
        '200':
          description: Already a learner of the organization; nothing changed and no email is sent.
          content:
            application/json:
              schema:
                type: object
                required: [user, created, emailSent]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  created:
                    type: boolean
                    const: false
                  emailSent:
                    type: boolean
                    const: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a learner
      responses:
        '200':
          description: Learner details.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update a learner
      description: Updates the learner's display name. Email and role changes are not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Avery Patel
      responses:
        '200':
          description: Updated learner.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: removeUser
      tags: [Users]
      summary: Remove a learner
      description: Disables the learner. They are signed out and can no longer sign in, their pending assignments are cancelled and open sessions end; their account and historical sessions are kept. A removed learner is no longer listed or returned.
      responses:
        '204':
          description: Learner removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /assignments:
    get:
      operationId: listAssignments
      tags: [Assignments]
      summary: List assignments
      description: Lists the organization's assignments, newest first.
      parameters:
        - $ref: '#/components/parameters/UserIdFilter'
        - name: email
          in: query
          description: Filter by the learner's email.
          schema:
            type: string
            format: email
        - $ref: '#/components/parameters/ScenarioFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Organization assignments.
          content:
            application/json:
              schema:
                type: object
                required: [assignments, pagination]
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssignmentDetail'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      operationId: createAssignment
      tags: [Assignments]
      summary: Create an assignment
      description: |
        Idempotently assigns a published scenario to a learner, by `userId` or by email. An email that isn't a learner yet is added to the organization first (with 30 starting credits), in the same request.
        A pending or used assignment for the same learner and scenario is returned as it is, with `created: false` and no email.
        A cancelled or expired one is reopened with a new `practiceUrl` and email (`201`, `created: true`).
        Someone new to the organization's credits gets 30 (1 credit = 1 minute of practice) from its prepaid balance;
        `409` when the balance can't cover them. The learner practises through its personal `practiceUrl` as many times
        as their credits allow, signing in with the assigned email. Email failure does not roll back the assignment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentTarget'
      responses:
        '201':
          description: Assignment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentMutation'
        '200':
          description: Assignment already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    get:
      operationId: getAssignment
      tags: [Assignments]
      summary: Get an assignment
      responses:
        '200':
          description: Assignment details.
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment:
                    $ref: '#/components/schemas/AssignmentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      operationId: updateAssignment
      tags: [Assignments]
      summary: Update an assignment
      description: Moves an assignment to another learner, published scenario, or both. A change issues a new `practiceUrl` (the old link stops working) and emails the learner. Moving onto a learner and scenario pair that already has an assignment returns `409`, as does moving it to someone new to the organization's credits when the balance can't cover their 30.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                userId:
                  type: string
                  example: user_123
                email:
                  type: string
                  format: email
                  description: Move the assignment to this email address instead of a learner ID.
                  example: learner@example.com
                scenario:
                  type: string
                  pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
                  example: system-design-interview
      responses:
        '200':
          description: Assignment update result.
          content:
            application/json:
              schema:
                type: object
                required: [assignment, changed]
                properties:
                  assignment:
                    $ref: '#/components/schemas/Assignment'
                  changed:
                    type: boolean
                  emailSent:
                    type: boolean
                    description: Present when the assignment changed.
                  practiceUrl:
                    description: Learner's direct practice link for this assignment.
                    type: string
                    format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: deleteAssignment
      tags: [Assignments]
      summary: Delete an assignment
      responses:
        '204':
          description: Assignment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /sessions:
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: List sessions
      description: Lists practice-session summaries. Use the detail endpoint for transcript and evidence data.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
        - $ref: '#/components/parameters/UserIdFilter'
        - $ref: '#/components/parameters/ScenarioFilter'
        - $ref: '#/components/parameters/AssignmentFilter'
        - $ref: '#/components/parameters/FromFilter'
        - $ref: '#/components/parameters/ToFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Practice sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions, pagination]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      tags: [Sessions]
      summary: Get a session
      description: Returns pinned configuration versions, transcript, evidence, and presigned download URLs for the audio and video recordings when available.
      responses:
        '200':
          description: Session details.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Organization API key generated in Dashboard → account menu → Developer API (dash.trainertwin.com/developer).
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      description: Number of records to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    UserId:
      name: userId
      in: path
      required: true
      description: Learner user ID.
      schema:
        type: string
    UserIdFilter:
      name: userId
      in: query
      description: Filter by learner user ID.
      schema:
        type: string
    ScenarioFilter:
      name: scenario
      in: query
      description: Filter by published scenario slug.
      schema:
        type: string
    AssignmentFilter:
      name: assignmentId
      in: query
      description: Filter by assignment ID (every practice of one assignment).
      schema:
        type: string
    ScenarioSlug:
      name: scenarioSlug
      in: path
      required: true
      description: Scenario slug.
      schema:
        type: string
      example: react-mock-interview
    FromFilter:
      name: from
      in: query
      description: Only include sessions started at or after this ISO 8601 timestamp.
      schema:
        type: string
        format: date-time
        example: '2026-09-01T00:00:00Z'
    ToFilter:
      name: to
      in: query
      description: Only include sessions started at or before this ISO 8601 timestamp.
      schema:
        type: string
        format: date-time
        example: '2026-09-30T23:59:59Z'
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      description: Assignment ID.
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Practice-session ID.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, expired, or revoked API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: API key creator is no longer an organization trainer (admin or team member).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found in the API key's organization.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with existing organization data, or the organization's credits can't cover a new learner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: API key exceeded 120 requests per minute. Retry after the number of seconds in the Retry-After header.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: What went wrong, in words you can show.
          example: Not found.
        code:
          type: string
          description: >-
            A stable code for the refusal, the same wherever it happens: api_key_invalid (401), scope_missing (403),
            api_key_owner_gone (403), rate_limited (429, with a Retry-After header in seconds), invalid_input (400),
            invalid_email (400), not_found (404), person_disabled (409), person_is_studio (409),
            assignment_exists (409), account_shared (409), roleplay_access_removed (403), minutes (credits: 400, 403
            or 409), calls_not_ended (500), internal_error (500).
          example: not_found
    Pagination:
      type: object
      additionalProperties: false
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
        total:
          type: integer
          example: 124
    User:
      type: object
      required: [id, memberId, name, email, emailVerified, role]
      properties:
        id:
          type: string
          example: user_123
        memberId:
          type: string
          example: member_123
        name:
          type: string
          example: Avery Patel
        email:
          type: string
          format: email
          example: avery@example.com
        emailVerified:
          type: boolean
        role:
          type: string
          const: member
        createdAt:
          type: string
          format: date-time
    Scenario:
      type: object
      required: [slug, name, version, visibility]
      properties:
        slug:
          type: string
          example: react-mock-interview
        name:
          type: string
          example: React mock interview
        version:
          type: integer
          example: 3
        visibility:
          type: string
          enum: [public, private]
    ScenarioSummary:
      type: object
      required: [slug, name, version, visibility, order, assignmentCount, createdAt, updatedAt]
      properties:
        slug:
          type: string
          example: react-mock-interview
        name:
          type: string
          example: React mock interview
        version:
          type: integer
          example: 3
        visibility:
          type: string
          enum: [public, private]
        order:
          type: integer
          description: Dashboard display order (ascending).
          example: 0
        assignmentCount:
          type: integer
          description: Learners currently assigned to this scenario (pending or used assignments).
          example: 12
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ScenarioDetail:
      type: object
      required: [slug, name, version, visibility, order, assignmentCount, createdAt, updatedAt, data]
      properties:
        slug:
          type: string
          example: react-mock-interview
        name:
          type: string
          example: React mock interview
        version:
          type: integer
          example: 3
        visibility:
          type: string
          enum: [public, private]
        order:
          type: integer
          description: Dashboard display order (ascending).
          example: 0
        assignmentCount:
          type: integer
          description: Learners currently assigned to this scenario (pending or used assignments).
          example: 12
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: Role-play configuration from the dashboard (objective, difficulty, persona hints). Opaque display data, not a stable contract.
          example:
            objective: Assess the candidate's React fundamentals under interview pressure.
    AssignmentTarget:
      type: object
      additionalProperties: false
      required: [scenario]
      anyOf:
        - required: [userId]
        - required: [email]
      properties:
        userId:
          type: string
          description: A learner ID from `GET /users`. Send `userId` or `email`.
          example: user_123
        email:
          type: string
          format: email
          maxLength: 320
          description: Assign by email; someone new is added to the organization as a learner first. Send `userId` or `email`.
          example: learner@example.com
        scenario:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]*$'
          example: react-mock-interview
    Assignment:
      type: object
      required: [id, assignedAt, userId, email, scenario]
      properties:
        id:
          type: string
          example: assignment_123
        assignedAt:
          type: string
          format: date-time
        userId:
          type: string
          description: The learner.
          example: user_123
        email:
          type: string
          format: email
          example: avery@example.com
        scenario:
          type: string
          example: react-mock-interview
    AssignmentMutation:
      type: object
      required: [assignment, created]
      properties:
        assignment:
          $ref: '#/components/schemas/Assignment'
        created:
          type: boolean
        emailSent:
          type: boolean
          description: Present when a new assignment was created.
        practiceUrl:
          description: Learner's direct practice link for this assignment.
          type: string
          format: uri
    AssignmentDetail:
      type: object
      required: [id, assignedAt, status, practiceCount, lastPracticedAt, user, scenario, practiceUrl]
      properties:
        id:
          type: string
          example: assignment_123
        assignedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        practiceCount:
          description: How many times the learner has practised it (sessions started from it).
          type: integer
          example: 3
        lastPracticedAt:
          description: When the latest practice started; null before the first.
          type: [string, 'null']
          format: date-time
        user:
          type: object
          description: The learner the assignment belongs to.
          required: [id, name, email]
          properties:
            id:
              type: string
            name:
              type: string
            email:
              type: string
              format: email
        scenario:
          $ref: '#/components/schemas/Scenario'
        practiceUrl:
          description: Learner's direct practice link for this assignment.
          type: string
          format: uri
    AssignmentStatus:
      type: string
      enum: [pending, used, expired, cancelled]
      x-enum-descriptions:
        pending: Assigned; the learner has not practised it yet.
        used: The learner has practised it at least once; the link still works.
        expired: Only on assignments made before links stopped expiring; assigning again reopens it.
        cancelled: The assignment was cancelled (for example by reassignment).
    SessionStatus:
      type: string
      enum: [assigned, activating, active, completed, abandoned, failed, revoked]
      x-enum-descriptions:
        assigned: Assignment created; the learner has not started practicing yet.
        activating: Session is starting (transient).
        active: Session is live.
        completed: Learner finished the session.
        abandoned: Learner left before completing; a later start abandons this one.
        failed: Session activation or runtime failed.
        revoked: Session was revoked through the dashboard.
    SessionSummary:
      type: object
      required:
        - id
        - personaSlug
        - personaVersion
        - agentSlug
        - agentVersion
        - status
        - startedAt
      properties:
        id:
          type: string
          example: session_123
        userId:
          type: [string, 'null']
          example: user_123
        personaSlug:
          type: string
        personaVersion:
          type: integer
        agentSlug:
          type: string
          example: react-mock-interview
        agentVersion:
          type: integer
        assignmentId:
          description: The assignment it was started from (each practice is a new session); null when started without one.
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/SessionStatus'
        mode:
          description: Delivery mode of the session.
          type: string
          enum: [chat, voice]
        contextName:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
          description: Null until the learner starts the session.
        endedAt:
          type: [string, 'null']
          format: date-time
    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          properties:
            transcript:
              description: Structured session transcript when available.
              type: [object, array, 'null']
            evidence:
              description: Structured evaluation evidence when available.
              type: [object, array, 'null']
            audioUrl:
              description: Presigned audio recording download URL, valid for one hour. Null when no audio recording exists.
              type: [string, 'null']
            videoUrl:
              description: Presigned video recording download URL, valid for one hour. Null when no video recording exists.
              type: [string, 'null']
