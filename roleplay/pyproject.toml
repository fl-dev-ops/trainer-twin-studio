[project]
name = "trainertwin-agent"
version = "0.1.0"
description = "TrainerTwin Pipecat voice agent running the spec-driven interview runtime"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[sarvam,silero,webrtc,runner]>=0.0.105,<2",
    "python-dotenv>=1,<2",
    "chromadb>=1.5,<2",
    "libsql>=0.1,<1",
    "pydantic-ai-slim[openai]>=1,<2",
    "pyyaml>=6,<7",
    "anydocs>=0.1,<1",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "boto3>=1.35,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["bot.py", "interview.py", "runner.py"]
