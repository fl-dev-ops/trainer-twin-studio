[project]
name = "trainertwin-agent"
version = "0.1.0"
description = "TrainerTwin Pipecat voice agent running the spec-driven interview runtime"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[sarvam,silero,webrtc,runner]>=0.0.105,<2",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["bot.py", "tools.py", "workspace_bridge.py", "recording.py", "web_tts.py"]
