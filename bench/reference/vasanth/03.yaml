      we need to use that int keyword. So loosely typed language means there are
      no restrictions of type.

  - t: "00:11:18"
    role: interviewer
    text: >-
      Absolutely. Absolutely right, Saurabh. Actually, I sense that you have very
      good fundamentals. What you're saying is absolutely right. Loosely typed are
