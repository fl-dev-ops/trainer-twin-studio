      JavaScript is single-threaded and not multi-threaded?

  - t: "00:09:06"
    role: candidate
    restitched: true
    text: >-
      Okay. So basically, JavaScript is single threaded. What single threaded
      means is it executes one task at a time. It's not parallel processing. So
