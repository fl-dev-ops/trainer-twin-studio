      the result, etcetera. But there are a lot of concepts involved in this. It's
      not that straightforward. There is a concept of a resolver, there is a
      concept of authentication, private IP, public IP. So all may not be asked at
      a fresher level, but if you are a web developer, this is one of the primary
      things to know in depth. You can check how HTTP works, how HTTPS works, how
      a request gets processed. Just spend some time on all of that. I'll ask you
      just one question on the networking aspect, as entire web development
      actually happens between the connection between client and server. Correct?
      Do you know what is TCP and what is UDP?

  - t: "00:04:47"
    role: candidate
    text: Yes, these are the protocols for request and response.

  - t: "00:04:51"
    role: interviewer
    text: Correct. So do you know the abbreviation of TCP?

  - t: "00:04:54"
    role: candidate
    text: "Yeah, it's transmission control protocol. And UDP stands for..."

  - t: "00:05:02"
