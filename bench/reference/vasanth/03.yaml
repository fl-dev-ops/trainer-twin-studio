      JavaScript libraries and frameworks which are like React JS and Next JS. I
      also have some hands-on experience on React and Next and also did a couple
      of internships using all these, and also worked on some live projects.
      Currently I'm looking for internships and full time roles.

  - t: "00:01:30"
    role: interviewer
    text: >-
      Great, great, Saurabh. And Saurabh is already actually interning at
      Reliance Jio, which I'm very happy about, because people in pre-final year
      and final year getting internships is a good sign. So Saurabh, now without
      wasting further time let's get started. Let's start with the extreme basics
      of web development. I'll ask you one very basic question. So let's say you
      are opening a website — for example, google.com. You entered google.com in
      the search bar of the browser and hit enter. Can you tell me what all
      happens in the background to get that content and show it on the screen?

  - t: "00:02:02"
    role: candidate
    restitched: true
    text: >-
      Okay. So initially, if we talk about what is Google — Google is a search
      engine which is used to rank the websites. So when we are typing something
      like, for example, Apple or something, our search query gets to the Google
      server, and then Google processes our query and generates some results and
      then sends those results to our browser, and then our browser parses it and
      shows the UI.

  - t: "00:02:36"
    role: interviewer
    text: >-
      Got it. So there are two parts to it. What you said is how the Google
      search engine would take the input and give the result. My question is,
      it's not google.com — any website that you search in that search bar and
      hit enter, right? After that what would happen? It's not just Google, any
      website for that matter, you hit enter. What will the browser do to get the
      data?

  - t: "00:02:56"
    role: candidate
    text: >-
      Okay, so imagine ourselves as a client, and when we search something at the
