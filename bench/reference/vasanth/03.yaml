  - t: "00:06:36"
    role: candidate
    text: "The uh... I can't remember."

  - t: "00:06:40"
    role: interviewer
    restitched: true
    text: >-
      No worries, no problem. See, in an interview every question that you answer
      wrongly will not be corrected. But I am just using this opportunity to help
      you. Generally it is at the end, if you have any doubts you can ask and that
      will get answered. See, TCP and UDP — what you said is correct. TCP is
      connection oriented, UDP is connectionless. And the example that you gave
      for UDP is also very right. So where basically things like video calling,
      correct? Like now we both are connected over Zoom. So in this particular
      video call, let's say some amount of packets are lost — there's a small
      microsecond when whatever I spoke is not heard by you, still there is no
