  - t: "00:11:55"
    role: candidate
    text: >-
      I think the reason can be to give more power to the developer, like a more
      flexible kind of thing.

  - t: "00:12:03"
    role: interviewer
    text: >-
      Correct. That could be one. While creating a language, what you are saying
      is definitely considered — how we can make it easy for the developer.
      Correct. But there is also another very important aspect from the
      architecture point of view. Do you see why, from the architectural point of
      view, JavaScript is a weakly typed language?

  - t: "00:12:26"
    role: candidate
    text: I can't remember.

  - t: "00:12:27"
    role: interviewer
    restitched: true
    text: >-
      No worries. I'll tell you why it is a weakly typed language. See, JavaScript
      doesn't run on a system like C, C++ or Java, correct? JavaScript is
      technically built for running on a browser. So it doesn't directly interact
      with the system hardware, correct? So whenever a language like that is
      created, which is not directly interacting with the hardware — and these are
      all running in the browser — they don't have direct access to the memory. So
      if it is strongly typed, int x, then whenever you write int x in the browser
      there is no guarantee that much memory is allocated to it from the hardware,
      because it's running on the browser. So because of this dynamic type
      allocation, the JavaScript engine can make sure whatever kind of memory is
      available right at that point in time can be picked and allotted, and later
      it can be cleared also. That's one of the main reasons why JavaScript is
      weakly typed. There are a lot of other reasons also why it is weakly typed —
      please read more about it. Now let's get into a little more depth of the
      JavaScript concepts. So tell me, what are closures in JavaScript?

  - t: "00:13:38"
    role: candidate
    text: >-
      Okay. So closures — closure means a function bound to its outer scope or a
      lexical environment. So when we call the inside function, it remembers the
      outer variables and methods.

  - t: "00:13:54"
    role: interviewer
    text: >-
      Correct, correct. So a function having access to the lexical environment of
      the outer function can be called a closure. Correct? This is the right
      definition. What you're saying is not wrong. Try to have a proper definition
      so that there are no cross questions to that. So that's one. So now give me
      one practical example why or where you can use closures.

  - t: "00:14:15"
    role: candidate
    romanized: true
    restitched: true
    text: >-
      Okay, so imagine we want some DOM manipulation and we have something called
