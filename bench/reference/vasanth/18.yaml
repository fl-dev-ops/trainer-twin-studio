problem: >-
  Implement a password strength checker in React - a function that accepts a
  password string and reports whether it is strong (must contain a lowercase
  letter, an uppercase letter and a digit), then wire it up to an input box.

# Sarvam gives three ids for two people. Vasanth is mostly id 3 but also
# surfaces as id 1 (00:12:16, 00:12:19); Vishal is mostly id 2 but also surfaces
# as id 1 (00:02:51, 00:11:04, 00:13:26). Every turn below was attributed by
# content, not by id.
raw_speaker_ids:
  interviewer: [3, 1]
  candidate: [2, 1]

invariants:
  - Turns strictly alternate interviewer -> candidate. No two consecutive same-role turns.
  - No reference to a YouTube channel, video, subscriber, audience or viewer.
  - No screen-sharing, editor or tool-operation instructions.
  - Text is English in Latin script only.

counts:
  raw_entries: 204
  clean_turns: 67

removed:
  monologue:
    - span: "00:00:00-00:00:44"
      what: >-
        Channel intro, "watch the video till the end", promise to give the right
        answers at the end of the video.
    - span: "00:24:09-00:24:18"
      what: Outro - like the video, subscribe to the channel, see you in the next video.
  self_promotion:
    - "00:01:24-00:02:51 - sponsored read for a third-party video-calling SDK: brand name, 'I've told about this product in the past as well', 'ten thousand free seconds', sign-up pitch. The genuine technical content (complexity of video calling, protocol choice, cross-browser support, group vs one-to-one chat, in-room messages, use a ready-made UI kit) is kept; the advertisement is removed."
    - "00:09:52 - 'for audience who are watching the right answer is stack' -> 'the right answer is stack'"
    - "00:11:22 - 'even the audience should not get confused' / 'Audience also I'm saying again'"
    - "00:12:25 - entire turn addressed to viewers explaining how far along Vishal is with React"
    - "00:13:36 - 'just advice to you and everyone who is watching the video' -> 'just advice to you'"
    - "00:14:34 - 'audience watching the video you guys can also practice this in parallel... put your code in the comment section or create a gist... I will verify it'"
    - "00:18:36 - 'if audience know the answer you can pause the video... mention question number two and your answer in the comment section'"
    - "00:21:16 - 'let me give my feedback to you and audience whoever has watched the video... if you enjoyed please like and comment' and 'I'm not gonna explain anything that Vishal has given a wrong answer'"
    - "00:23:29 - 'you are watching my video on YouTube, tomorrow if you have to implement this' -> neutral 'when you use an application'"
