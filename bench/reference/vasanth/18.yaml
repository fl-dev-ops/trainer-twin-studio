    - "00:15:54-00:16:00 - 'how to view the console here' / 'you see a console in the bottom right'"
    - "00:16:32 - 'you can refresh it'"
    - "00:17:29 - 'can you go to the same snippet again, hold left'"
    - "00:18:36 - 'copy the snippet, I'll put it in the chat section, you can replace your code with this code, I don't have to run it'"
    - "00:21:07 - 'you can stop sharing'"
