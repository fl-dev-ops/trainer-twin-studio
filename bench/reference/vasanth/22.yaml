      that your mind starts thinking analytically, so that it helps you both in DSA
      problem solving as well as in the problem solving of anything typical, whether
      it's React or Angular or DSA. Everything — the analytical thing is very
      important. Solving more DSA problems will help you to do that, Aditi. The rest
      looks good to me. This is my honest feedback. Do you have any closing thoughts
      or any questions?

  - t: "00:22:32"
    role: candidate
    text: >-
      I have one, honestly, Vasanth. What is your take on front end developers
      doing extensive LeetCode? Like, very extensive — hard, medium, I'm talking
      about.

  - t: "00:22:43"
    role: interviewer
    romanized: true
    restitched: true
    text: >-
      So, it's a very good question, Aditi. So I myself have solved a good number
      of problems on LeetCode. So my suggestion to all is, unless you are targeting
      companies like Google — there are hardly a few countable companies whose
      interview process is purely driven by DSA. Like, if you go for Google, I've
      given interviews where three rounds were pure DSA; they did not ask any front
      end questions. Okay? So if you are targeting that kind of company, then I
      would advise you to solve as many problems as possible, because how many to
      solve, nobody knows. So it's good to solve any number of problems. If not,
      even if you are targeting very premium product based companies also, most
      companies for a front end role do not ask very, very complicated DSA. They ask
      DSA, but it is usually in array, string, stack, queue and linked list — five
      data structures. So I suggest everyone the same thing: try to solve a hundred
      problems collectively, where you solve sixty easy problems, twenty medium
      problems and twenty hard problems. Start by easy problems. So twenty medium
      problems means — one medium is two easy problems, one hard is two medium
      problems. So when you solve one hard problem, you are solving four easy
      problems, correct? So start by solving as many as possible easy problems,
      spread across the five data structures — array, strings, stack, queue and
      linked list. So beyond the five data structures, is it required to learn from
      the learning point of view? Yes. From the interview point of view, the
      probability of asking questions beyond this is less. So you end up spending so
      much time on learning them without any return. That's what my take is, Aditi.

  - t: "00:24:26"
    role: candidate
    romanized: true
    text: Okay, okay. So it's expected, and it's always good to have knowledge.

  - t: "00:24:31"
    role: interviewer
    text: >-
      Uh, yes. I suggest, if you are interested in learning DSA, go beyond linked
      lists — like trees or graphs, or very specific algorithms like Dijkstra to
      find the shortest node. You could extend and learn. From the interview point
      of view, for most companies I suggest you stick to five data structures:
      array, string, stack, queue and linked list. Solve collectively a hundred
      problems from these five data structures on LeetCode. That's going to be most
      helpful for you, Aditi. Yeah.

