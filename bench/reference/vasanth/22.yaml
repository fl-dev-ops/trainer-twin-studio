problem: >-
  Two parts. First, a warm-up DSA question - reverse a given array, discussing
  the built-in reverse, the extra-array loop, and finally the in-place two
  pointer approach with its space and time complexity. Second, a machine coding
  task - implement a timer in Angular showing minutes and seconds with start and
  stop/reset buttons, incrementing every second and rolling seconds over into
  minutes.

# Speaker 1 is Vasanth and Speaker 2 is Aditi throughout, but the ids are not
# trustworthy at boundaries - Sarvam repeatedly emits the same phrase under both
# ids a second apart ("Correct. Good catch." at 00:18:39, "So you can use a
# clear" at 00:18:44). Every turn below was attributed by content.
raw_speaker_ids:
  interviewer: [1]
  candidate: [2]

invariants:
  - Turns strictly alternate interviewer -> candidate. No two consecutive same-role turns.
  - No reference to a YouTube channel, video, subscriber, audience or viewer.
  - No screen-sharing, editor or tool-operation instructions.
  - Text is English in Latin script only.

