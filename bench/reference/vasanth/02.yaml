  - t: "00:05:28"
    role: candidate
    restitched: true
    text: >-
      Yeah, so closures in JavaScript happen when we have — say suppose we have
      an outer function and we have an inner function. Now that outer function
      is returning an inner function which will be executed later. And what
      happens is, because we know that the inner function will be executed later
      in some time, but it can use some of the variables which were local to
      that outer function, the parent function. And due to that, JavaScript has
      to keep some closure. So in this scenario closure happens, where even if
      the outer function's execution was completed, still the inner function has
      access to the variables defined inside the outer function. So that's a
      scenario where closures happen.

  - t: "00:06:20"
    role: interviewer
    text: >-
