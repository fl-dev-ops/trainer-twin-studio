  - t: "00:08:52"
    role: candidate
    restitched: true
    text: >-
      Yeah, so in currying what happens is, say suppose we have a function which
      takes some arguments, and then we want that function to be partially
      executed. I'll take an example and that will make it easier. So suppose we
      have an add function, and the add function takes multiple arguments, let's
      say three or four arguments. And we want to curry it. So in currying what
      happens is, when you pass that function to a curried function, then what
      we get is a new function which can be invoked with single parameters. So
      say suppose A, B, C were passed to the original function; the curried
      function can be executed partially, so you can pass one and then two, and
      then it will return a new function which can be invoked by passing three.

  - t: "00:09:55"
    role: interviewer
