  - t: "00:10:35"
    role: candidate
    restitched: true
    text: >-
      Yeah, so in React what happens is, whenever we change the props — whenever
      a component's prop is changed, or the state is changed; state is inside
      that component only, but props are passed from outside — so whenever the
      prop is changed, the parent component might be providing some prop and
      then later on it provides a new value of that prop. That time the
      component re-renders. And usually that's the default behaviour, but
      sometimes what we want is, we want that component to re-render only when
      we receive a new value of the prop, and we want to skip the re-rendering
      whenever the same props are being passed. So in that case we create a
      component — we can say that the component that we want is a pure
      component, which only re-renders when the props are changing. And by
      default, in class components there is a PureComponent class from which we
      extend and create a new component.

