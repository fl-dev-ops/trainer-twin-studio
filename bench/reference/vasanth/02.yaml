  - t: "00:02:46"
    role: candidate
    restitched: true
    text: >-
      All right, hoisting. So what happens is, when the JavaScript engine gets a
      program to be executed, it runs that program in two phases. The first one
      is the creation phase, in which it basically scans what is inside the
      code, and then the interpreter comes into the second phase, which is the
      execution phase, in which line by line it executes all the program that we
      have written. So in the creation phase what happens is, first, when we
      give a program file to the interpreter, then in the creation phase all the
      variable declarations are hoisted to the top of the program. So say
      suppose we have ten lines in the program and on the fifth line you are
      creating a variable — so on those top four lines you can use that variable
      x. Why? Because hoisting is happening, so the JavaScript engine creates a
      separate space for those variables even though they are defined at the
      bottom of the file. In the scanning process it creates them and declares
      them, or initializes them with an undefined value. This is hoisting
      basically.

  - t: "00:04:08"
