    text: >-
      Sure. Prem, I'm done from my end. The biggest problem that I face, Prem
      Kumar, is comprehending skills. So comprehending skill is one of the most
      underrated interview skills, where you need to understand the question at
      the earliest. Interviewers do not like to repeat the question multiple
