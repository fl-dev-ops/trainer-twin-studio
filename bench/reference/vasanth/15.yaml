  - t: "00:07:34"
    role: interviewer
    text: >-
      Correct, absolutely. Okay. So line number four, you have a useState, right,
      Prem Kumar?

  - t: "00:07:39"
    role: candidate
    text: Yes.

  - t: "00:07:40"
    role: interviewer
    text: "So what is useState?"

  - t: "00:07:43"
    role: candidate
    restitched: true
    text: >-
      Yeah, so useState is a hook provided by React where we can manage the
      state. It has two parameters — one is, sorry, two values: one is the state
      value and the other is a set state function. So this is like a variable
      which you can render inside any JSX, or you can use in any computation. And
      any value or any update to this state variable should be done using the set
      state function. We cannot directly modify this.

  - t: "00:08:18"
    role: interviewer
    romanized: true
    text: >-
      So, I will also share a simple JavaScript code snippet with you. OK. Tell
      me, what will be the output?

  - t: "00:08:34"
    role: candidate
    text: "So we'll get John as the output."

  - t: "00:08:38"
    role: interviewer
    text: "Okay. Yeah, sure. Please explain to me what is happening behind the scenes."

  - t: "00:08:47"
    role: candidate
    restitched: true
    text: >-
      Yeah. So upon execution we are encountering a function call here. So this
      executes createPerson, and it has two parameters, name and age. And here we
      are returning an object as a value. Again, inside the object we have two
      keys which are holding a function. And here, what we will get is this
      entire object. And since the object has two functions, we are calling one
      of them, which is getName. getName is returning the name which we have
      passed here when the function is getting executed. So it is returning —

  - t: "00:09:23"
    role: interviewer
    text: "Which famous JavaScript concept does it relate to, Prem?"

  - t: "00:09:28"
    role: candidate
    restitched: true
    text: >-
      So this is closure. Where it holds the lexical scope even after this
      execution. So upon execution of this statement, right, the memory whatever
      is assigned to this variable will be cleared ideally, but since it has the
      function definitions here, this holds the lexical scope of the variable
      whatever it is entitled to. So here we are calling the function, and it is
      trying to get the name from its lexical scope, and then it is printing.

  - t: "00:10:04"
    role: interviewer
    text: >-
      Okay. See, I'll just summarize, Prem. So even after a function has returned
      some value — a function has returned a function — even the function that is
      returned will still have access to its parent scope, correct?

  - t: "00:10:18"
    role: candidate
    text: Correct.

  - t: "00:10:19"
    role: interviewer
    text: >-
      Looking at it, Prem Kumar — this is a simple example which I am also aware
      of. Looking at it, you tell me, what is the disadvantage of having a
      closure in JavaScript? What is the disadvantage if you look at this
      example?

  - t: "00:10:35"
    role: candidate
    text: >-
      Yeah, the main disadvantage of closure is the memory leak, because it
      consumes more memory. This is a simple function and we don't have any
      challenge with that, but as it grows more and more, all the lexical scope
      will be remaining in the memory, which consumes more space for each and
      every variable or function.

  - t: "00:10:53"
    role: interviewer
    text: >-
      Yeah, to an extent that is correct. The memory — we have to allocate more
      memory, as every inner function needs to have access to the lexical scope.
      That is one. Anything else that comes to your mind, Prem Kumar?

  - t: "00:11:06"
    role: candidate
    text: Not at the moment.

  - t: "00:11:08"
    role: interviewer
    text: >-
      I'll tell you probably what the problem is — you try to build on that. How
      do you think, will it add any problem to the garbage collection of
      JavaScript, clearing the memory? Have you heard the term garbage
      collection?

  - t: "00:11:24"
    role: candidate
    text: "Yes, yes."

  - t: "00:11:25"
    role: interviewer
    text: "Yeah. So will having a closure have any effect on the garbage collection?"

  - t: "00:11:30"
    role: candidate
    text: >-
      It will not be garbage collected, because it remains in the lexical — all
      of it remains in the lexical scope.

  - t: "00:11:35"
    role: interviewer
    text: >-
      That's my question. So do you feel closure is having any problem, or any
      effect on the garbage collection of JavaScript?

  - t: "00:11:42"
    role: candidate
    text: >-
      The memory whatever is getting allocated to these variables, right, or
      functions — it will not be cleared upon its completion in the call stack,
      because it still remains in the JavaScript memory. So it will not be
      garbage collected, whatever the lexical scope that is available here.

  - t: "00:12:02"
    role: interviewer
    text: >-
      Right. So what is your recommendation? Should we be using more closures or
      less closures in a given project?

  - t: "00:12:10"
    role: candidate
    text: >-
      So it depends on the case. If the use of closure is going to reduce the
      definition whatever you are going to write, or if it is enhancing the
      reusability, we can go with closure; or else we can go with normal.

  - t: "00:12:31"
    role: interviewer
    romanized: true
    text: >-
      So you recommend, not necessarily we should — there is no hard and fast
      rule; only if you need it, use closure. Is that what you are saying, Prem
      Kumar? Correct?

  - t: "00:12:38"
    role: candidate
    text: "Yes, yes."

  - t: "00:12:39"
    role: interviewer
    text: >-
      Okay, sure. Be a little louder. Yeah, again, can you give me an example for
      the useMemo hook? I need an example for the useMemo hook.

  - t: "00:13:02"
    role: candidate
    restitched: true
    text: >-
      Okay. So useMemo is basically — memo is the result of any function,
      whatever it is returning. And it re-executes the function only if there is
      any change in the dependency whatever you are passing. Similar to useEffect,
      where it takes a dependency. So upon a change in dependency it will
      re-execute the function and it will give the value. If there is no change
      in the dependency value, it will give the value from wherever it is stored.

  - t: "00:13:33"
    role: interviewer
    text: "Sure. Give an example. Write an example — I want an example for useMemo."

  - t: "00:13:52"
    role: candidate
    text: "I just couldn't get anything immediately as an example."

  - t: "00:13:58"
    role: interviewer
    text: "You're not able to come up with an example, is it?"

  - t: "00:14:03"
    role: candidate
    text: "Yeah, yeah, I couldn't get it instantly."

  - t: "00:14:06"
    role: interviewer
    text: "Sure. Do you know how to write an example for the useCallback hook?"

  - t: "00:14:09"
