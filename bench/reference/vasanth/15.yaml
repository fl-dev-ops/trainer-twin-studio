  - t: "00:00:38"
    role: interviewer
    text: "Prem Kumar, can you please introduce yourself so that we can get started?"

  - t: "00:00:45"
    role: candidate
    text: >-
      Yeah, hi Vasanth. Morning, morning to everyone. So I am working as a React
      developer at Dimensions, based in Bengaluru. Here we are working on a React
      based mobile app which is like a one stop solution for multiple data
      sources. So you can introduce any data source into a single CRM, and then
      you can allow the user to consume data, and you can customize it in a
      better way since it is React.

  - t: "00:01:16"
    role: interviewer
    text: "Wonderful, wonderful, Prem Kumar. So, which place are you from?"

  - t: "00:01:20"
    role: candidate
    text: "I am from Namakkal, Tamil Nadu."

  - t: "00:01:22"
    role: interviewer
    romanized: true
    restitched: true
    text: >-
      Wonderful. Prem Kumar, you might be seeing a lot of social media
      applications, whether it's LinkedIn, Facebook, Facebook Messenger and a lot
      of other applications, right? So whenever you open the app, most of the
      apps show whether a user is online or not. Correct? Can you please tell me,
      if you have to build a feature like that, how — end to end? I'm not asking
      just from the front end point of view. As you have almost six years of
      experience and eight years of overall experience, just tell me at a high
      level how do you implement this feature, just to show whether a user is
      online or not. I'll give a little overview. I'm presenting a whiteboard.
      Okay. See, let's say we have one particular thing — you have a user one,
      okay? So this is user one. So I am chatting with like ten different people.
      Now whenever I open my mobile application or web application, for all the
      ten users you need to show whether they are online or not, correct? So
      let's say there is a green dot that you will be showing, whether they are
      online or not, correct? Green for, let's say, online, and red if they are
      offline, okay? So let me, just for the sake of this one, say this is online,
      okay? And this guy is also online, and here is offline. So this particular
      guy is offline, the first two are online. So let's say you have to
      implement this functionality, Prem Kumar, OK. So now think, how are you
      going to basically build this? Because a user can be online or offline
      anytime. First you made an API call, got the data — that is wonderful. But
      eventually the user might change again, right? Let's say you are online and
      you go offline. How do you update this screen?

  - t: "00:03:09"
    role: candidate
    text: >-
      So you want to update these green and red dots based on the connection you
      subscribed to, right?

  - t: "00:03:15"
    role: interviewer
    text: >-
      Yes, because we cannot show somebody online when they are not online. That
      is a false implementation, correct? How do you go forward and implement
      this, Prem Kumar?

  - t: "00:03:26"
    role: candidate
    text: >-
      So I will give it a trial, let's see how it goes. Upon my initial login, I
      will fetch my list of connections, whoever is there, and then their
      available states. And then I need to subscribe to my connections' state
      change, like whether they are going offline or not. If they are logging
      out, I need to fetch that data and then I need to update my relevant status
      here — I mean the relevant connection status here.

  - t: "00:03:56"
    role: interviewer
    text: >-
      Sure, Prem Kumar. But there are a lot of intricacies to it, okay? It's
      probably one of the most difficult tasks, to show whether a particular user
      is online or not. It's a very difficult task. If you observe WhatsApp, they
      do not do that. It's not that very easy, and whatever you're saying is at a
      very high level, Prem Kumar. With your experience, you need to dig a little
      deeper to understand the end to end implementation, okay? So now in React,
      Prem Kumar, what are all the different types of applications that you have
      built?

  - t: "00:04:26"
    role: candidate
    text: >-
      So I have built this mobile application, which is to consume data based on
      an API, and then we allow the user to —

  - t: "00:04:36"
    role: interviewer
    text: >-
      This is fine. The current project is fine. Other than that, any other type
      of project — e-commerce, social media, any other applications that you have
      built?

  - t: "00:04:45"
    role: candidate
    text: >-
      Okay. No, currently I'm working on an app which is like a CRUD app for
      Google Sheets. So I'm consuming data from Google Sheets and I'm building an
      app where the user can see the data and then they can add or edit or
      delete. So I'm just currently working on this.

  - t: "00:05:04"
    role: interviewer
    romanized: true
    restitched: true
    text: >-
      Sure, Prem Kumar. So yeah, got it. So Prem Kumar, I'm sharing a snippet
      with you. OK. So Prem Kumar, my question would be — if you click the
      Increment button three times, what will be the output?

  - t: "00:06:11"
    role: candidate
    restitched: true
    text: >-
      Okay, zero plus one. It will be one, because we are directly updating the
      state without considering its previous value. So it will be set to one, and
      count will always take one from zero.

  - t: "00:06:32"
    role: interviewer
    text: "Prem Kumar, what was my question?"

  - t: "00:06:36"
    role: candidate
    text: "If you click the button three times, what is the value of count, right?"

  - t: "00:06:40"
    role: interviewer
    text: "Did I ask what is the value of count if I click three times?"

  - t: "00:06:44"
    role: candidate
    romanized: true
    text: "Oh. Maybe I have missed it. Can you repeat again, maybe I —"

  - t: "00:06:48"
    role: interviewer
    text: >-
      If you click the increment three times, what is it that will be rendered on
      the screen below the increment button?

  - t: "00:06:55"
    role: candidate
    text: "It will return or render the odd component."

  - t: "00:06:58"
    role: interviewer
    text: >-
      Yeah, I think you have to export that App component, because of which
