  - t: "00:00:30"
    role: interviewer
    text: Praveen, if you can introduce yourself, we can get started.

  - t: "00:00:55"
    role: candidate
    romanized: true
    restitched: true
    text: >-
      Yes sir. Thank you for giving me the opportunity to have a mock with you.
      So, actually, myself G Praveen Kumar. I completed my graduation in the
      year twenty twenty from the University College of Engineering,
      Kanchipuram, specialised in the mechanical department. Post graduation I
      got placed in an MNC, and the office space is in Bengaluru. I've been
      working with that MNC in the networking and security field for around
      three years now. But I'm more towards the development side, so I just want
      to switch my career to development rather than going in networking. That's
      all about me.

  - t: "00:02:00"
    role: interviewer
    restitched: true
    text: >-
      Now, let me ask you a very simple question. One of the common things that
      is present now on most of these e-commerce applications, or on any other
      sites like social media, is the typeahead system. Okay? Typeahead is
      nothing but where you will search something, and whenever you search
      something you start getting the results below that. Correct? Let's say
      this is the search bar, Praveen — a search bar of any website, let us say
      e-commerce, social media, anything. The user is searching something here,
      and whenever the user is searching something, basically we are giving a
      list of results that he is potentially looking for. The simplest example
      is, let's say you go to YouTube and search for "career". Correct? One
      option is career guidance for professors, another option is career
      guidance for experienced. So multiple options will be shown on the screen.
      Correct? So let's say we have to build this feature. As you know, the user
      can type something and you have to make an API call to get the results and
      show them on the screen. Yeah, I'm not too concerned about how the back
      end would process this and send the result — that part is fine. Just from
      the client side, you tell me, if you have to implement this, what all
      things come to your mind, Praveen?

  - t: "00:04:04"
    role: candidate
    restitched: true
    text: >-
      Yes sir. So basically, when the user tries to type something we need to
      fetch some data. We can do it in some ways, like for every keystroke we
      will be making an API call and we will be suggesting them something. And I
      think that will not be the optimal approach, because the number of API
      calls made will be large. So we can implement a concept of debouncing
      here, where we can reduce the number of API calls by a delay. If the user
      delays the key press event by a particular timing, we can call the API and
      we can give them the suggestions.

  - t: "00:04:48"
    role: interviewer
    restitched: true
    text: >-
      Correct? Okay. See, one of the techniques that you are proposing for
      better rendering here is debouncing, correct? I'm just noting it down
      here. Okay? So one technique is debouncing, correct — where, instead of
      making an API call every time the user types something, we are going to
      give some delay and then we are going to make an API call, correct? What
      other things come to your mind, Praveen? Anything else that comes to you
      where you could optimise?

  - t: "00:05:16"
    role: candidate
    text: Yeah, the other thing I can think of is we can use the concept of throttling as well.

  - t: "00:05:22"
    role: interviewer
    restitched: true
    text: >-
      That's fine. Both are basically similar, actually, correct? Anything else
      in your mind, Praveen? As you told, the simple thing that we need to do is
      when a user types something, we need to make an API call, get the data and
      show it on the screen. That's the minimum that we need to do. What are all
      the ways with which we can optimise this? If you're building this
      autocomplete as a system, what are all the ways that you think of
      optimising it? One you told, debouncing, which is hundred percent correct.
      Anything else?

  - t: "00:05:59"
    role: candidate
    text: Let me think about that.

  - t: "00:06:00"
    role: interviewer
    text: Sure, sure. Take a moment.

  - t: "00:06:02"
    role: candidate
    text: >-
      So, for every keystroke we should not be able to suggest that, so we need
      to optimise that. That was the ask, right?

  - t: "00:06:10"
    role: interviewer
    restitched: true
    text: >-
      There is no one ask as such in this problem. Okay. Basically this is a
      system that I want to build. I want to optimise it — anything you can
      optimise, like that. Correct? Because the basic flow is simple: enter
      something, make an API call, get the data, show it on the screen. That's
      the most basic thing that we need to implement. Correct? What are all the
      ways with which we could optimise? Please tell me.

  - t: "00:06:35"
    role: candidate
    text: >-
      The one thing I can think about is debouncing and throttling, but I
      suspect that we can use something called the React lifecycle to do that.

  - t: "00:06:45"
    role: interviewer
    restitched: true
    text: >-
      Yes. Yes. I mean, whatever you told is correct. There are some more things
      as well. Okay? Now, I'll ask you a couple of basic questions on React and
      JavaScript in general, then probably we'll get started with coding. Okay?
      So, as a matter of this, primitive and non-primitive types in JavaScript —
      tell me, what are primitive types and what are non-primitive types?

  - t: "00:07:10"
    role: candidate
    text: >-
      Yeah, the primitive data types consist of number, bigint, boolean, string,
      undefined and symbol, whereas the non-primitive data types consist of
      arrays, objects and functions. So basically all will be considered as
      objects.

  - t: "00:07:28"
    role: interviewer
    text: Yes. So what is the primary difference between primitive and non-primitive types?

  - t: "00:07:33"
    role: candidate
    restitched: true
    text: >-
      Primitive data types are used when we want to store a single value, and
      the non-primitive type is more like something defined by the developer —
      we can store multiple values. And the other difference is that primitives
      will be stored in the stack, whereas non-primitives will be stored in the
      heap memory.

  - t: "00:07:53"
    role: interviewer
    text: >-
      Got it. Sure, sure. Any idea, Praveen, why do you think there are two
      types, primitive and non-primitive? Putting it another way, the primitive
      types have individual memory allocation, correct? Like, they are
      immutable — basically once you allocate a memory they are immutable,
      whereas non-primitive types are usually mutable. Correct? Why do you think
      that is?

  - t: "00:08:17"
    role: candidate
    text: >-
      Yeah, why I think that is required is, we are not sure how much memory it
      will take for the non-primitive type, and we are sure that this much
      memory space is required for the primitive data types, so that will be
      stored in the stack. But in the heap we can expand the memory.

  - t: "00:08:36"
    role: interviewer
    text: >-
      No, but I think it is correct, Praveen. Like, in the heap you are storing
      because you could expand, because there is a liberty compared to here. But
      why do you think these arrays and objects are necessarily kept in the
      heap? Like, why can't an array or object be a primitive type? What is the
      problem in making them a primitive type?

  - t: "00:08:55"
    role: candidate
    text: >-
      Yes sir, we are not sure how much memory space it would take. We can't
      initially tell that this much memory space it will take.

  - t: "00:09:03"
    role: interviewer
    text: >-
      Correct. I agree. That is the reason why they are non-primitive. That's
      one way, and another thing could be that usually the assumption is it's
      quite larger data in the case of arrays and objects in a practical
      application. So it's better to keep them as non-primitive, because if you
      start storing them as primitive then we would end up using all our memory.
      Correct? Yes. Sure. So Praveen, are you aware of controlled components and
      uncontrolled components in React?

  - t: "00:09:31"
    role: candidate
    restitched: true
    text: >-
      Yes sir. So controlled components and uncontrolled components are both
      ways of handling the input element. So in the controlled component we will
      be handling the input element using React state — that input will be
      stored in React, whereas in the uncontrolled component that will be stored
      in the HTML. Like whenever we are clicking on the submit button we are able
      to perform the actions which we require. But in the controlled component we
      can do some other things like inline field validation, conditional
      rendering of the submit button and dynamic input. So this much more we can
      do with a controlled component.

  - t: "00:10:19"
    role: interviewer
    text: >-
      Correct. So, putting it up, the controlled component is more the React way
      of handling, and uncontrolled or non-controlled is the traditional
      HTML/JavaScript way of handling forms. Correct?

  - t: "00:10:30"
    role: candidate
    text: >-
      Yeah, in uncontrolled the input will be directly kept in the DOM. So in
      controlled we will be having it in the variable which we are storing.

  - t: "00:10:42"
    role: interviewer
    romanized: true
    restitched: true
    text: >-
      Good, good, sure. Let's start with a simple problem. Okay? So, the problem
