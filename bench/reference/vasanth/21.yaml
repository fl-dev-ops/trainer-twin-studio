  - t: "00:12:33"
    role: candidate
    text: Okay, got it. So I need to evaluate the result and I need to return it.

  - t: "00:12:38"
    role: interviewer
    restitched: true
    text: >-
      Correct. So to begin with, let's not use a calculator help. Let's imagine
