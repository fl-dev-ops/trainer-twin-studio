problem: >-
  Build a basic calculator in React that can perform addition, subtraction,
  multiplication and division. Typical calculator UI - a display area on top,
  digit buttons zero to nine, four operator buttons and an equals button. The
  expression is built purely from button presses; on equals the result is
  shown, and it is hidden again as soon as the user starts typing.

# Diarization is comparatively clean here - Speaker 1 is Vasanth and Speaker 2
# is Praveen for the whole recording. The unreliability is in the content, not
# the ids - roughly a third of the entries are one- or two-word interjections
# that Sarvam attributed to whichever speaker was louder. Attribution below is
# by content.
raw_speaker_ids:
  interviewer: [1]
  candidate: [2]

invariants:
  - Turns strictly alternate interviewer -> candidate. No two consecutive same-role turns.
  - No reference to a YouTube channel, video, subscriber, audience or viewer.
  - No screen-sharing, editor or tool-operation instructions.
  - Text is English in Latin script only.

counts:
  raw_entries: 206
  clean_turns: 47

