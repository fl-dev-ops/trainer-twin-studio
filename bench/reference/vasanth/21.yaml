      simple calculator — build a basic calculator that can perform addition,
      subtraction, multiplication and division. As simple a problem as that.
      Okay? So I require something similar to a Google calculator or a typical
      calculator UI, where there is one box on top, and we have the buttons one,
      two, three, four, five, six, seven, eight, nine and zero, and there will be
      an equals button, and we have plus, minus, star and divide — four
