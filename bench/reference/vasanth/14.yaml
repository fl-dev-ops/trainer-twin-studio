  - t: "00:14:14"
    role: interviewer
    text: >-
      Sure. So just as an extension to this example, Sumit. Give me, what are all
      the different ways with which we can ask JavaScript to execute
      asynchronously? Can you name a few different ways?

  - t: "00:14:26"
    role: candidate
    restitched: true
    text: >-
      Promises is there. And generator functions are there, that's what I can
