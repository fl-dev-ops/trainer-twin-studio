      that I think — maybe there are others but I don't know.

  - t: "00:14:54"
    role: interviewer
    text: >-
      So setTimeout, setInterval, promises and generator functions. These are all
      the primary things that you think can make JavaScript execute
      asynchronously. Correct?

  - t: "00:15:01"
    role: candidate
    text: "Yeah. Okay."

  - t: "00:15:02"
    role: interviewer
    text: >-
      Okay. Sure, sounds good. So can you just write a small example for useMemo
      or useCallback? Will you be able to write it, Sumit?

  - t: "00:15:13"
    role: candidate
    text: Yes.

  - t: "00:15:14"
    role: interviewer
    text: "Yeah. Let's write it for useMemo then."

  - t: "00:15:20"
    role: candidate
    romanized: true
    restitched: true
    text: >-
      So this is the example of useMemo, where you can memoize the value. So this
      is the concept for optimizing performance. If you are calculating some very
      big thing which is taking so much of time — like for the first time it takes
      two seconds to calculate — so if we render again and use that value, that
      value is again calculated and it takes two seconds, so it's a waste of
      performance. So what we do is, we use useMemo and memoize this value, so
      that the value is never — is not calculated again on every render.

  - t: "00:15:54"
    role: interviewer
    text: "Correct. Correct."

  - t: "00:15:55"
    role: candidate
    restitched: true
    text: >-
      And for handleClick we can use useCallback. So we can use useCallback. So
      here what happens is, whenever we return the handleClick function it will
      have a function reference, and every time it will be created because the
      render is happening. So to stop that we use useCallback, so that the
      reference is not changing with every render.

  - t: "00:16:27"
    role: interviewer
    text: >-
      Good, good. So whenever you click on Add Item, we are calling the
      handleClick, but whatever reference we already had for that function is not
