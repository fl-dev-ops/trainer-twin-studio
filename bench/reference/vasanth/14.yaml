  - t: "00:00:45"
    role: candidate
    text: >-
      Yeah, hi, this is Sumit. I've been doing React for the past five years. For
      the last three and a half years I'm in one company, and before that I was
      in a company which had a very toxic environment — that's why I changed that
      company. And yeah, I'm trying to switch again now. That's why I'm
      preparing.

  - t: "00:01:11"
    role: interviewer
    restitched: true
    text: >-
      Wonderful, wonderful, wonderful. So before we started, Sumit and I had a
      short connect. There was a lot of toxicity he faced in his previous
      company. I will not take much time to explain it, but let me quickly
      summarize. The primary toxicity he was facing was that he had just joined
      with two years of experience, but there were leads having like eight to ten
      years of experience, and they were expecting him to code at a similar
      level, which was hard to do. And whenever he was not meeting that
      particular expectation, they were scolding him. So that led Sumit into some
      amount of depression, and it took a lot of time to recover. The reason I'm
      saying this is that there could be a lot of people who are also facing this
      type of problem. So if you are facing that type of problem, my advice is —
      unless your financial situation is extremely bad, I would highly recommend
      you leave the company. Please try to switch to a different company, because
      at the end of the day we have to live this life, and not get into this toxic
      environment and get into depression and that sort of a thing. Okay.
      Anything you want to add, Sumit, before we start the actual interview?

  - t: "00:02:16"
    role: candidate
    text: >-
      Yeah, I just want to advise people — if you face any kind of toxic
      environment in your place and you are not able to cope with it, then I
      think the best advice is to switch the job. If not, just leave the job,
      because that will do more harm if you are working in that company.

  - t: "00:02:33"
    role: interviewer
    restitched: true
    text: >-
      Exactly. Yes, yes, absolutely, Sumit. So Sumit, now let us start. I have a
      very simple question, okay? How do we basically handle a real-time
      notification in a web application? The best examples for real-time
      notification are chatting systems like Facebook Messenger or Zoom chat, or
      the chatboards that are available on various different websites, correct?
      So whenever you go to B2C web applications, there are chatboards available.
      Correct? So let's say we have to implement that functionality, where a
      client basically sends a message to the server, and whenever the server
      sends the message the client is receiving it. Okay? I've opened the
      whiteboard. So I want you to explain the architecture, Sumit, because you
      have five plus years of experience. If you have to implement this feature,
      how are you going to implement it? Over to you, Sumit.

  - t: "00:03:37"
    role: candidate
    restitched: true
    text: >-
      Okay, so I've never worked with chatbots and all that. But what I do
      sometimes is general Googling of new stuff. So I think web sockets are used
      to get the messages to and fro, if this is a chatbot. So we can initialize
      a web socket on a URL that is given to us, and it starts talking to it. So
      maybe when the web socket — it has different functions like onmessage or
      something like that. Whenever that message comes, we will store that data
      into a state. Whenever the state changes we can just render a new
      component, or render the components depending on the messages coming. So
      that's the approach I will take.

  - t: "00:04:31"
    role: interviewer
    restitched: true
    text: >-
      See, I've drawn a diagram, a simple starter diagram, Sumit, okay? So we
      have a client, we have a server. Let's say the chatbot runs here, okay. So
      now, whatever you are saying — there is a dedicated connection that has
      been established, correct? So the right way to represent it would be using
      a plain line, for example. Let me draw. So you have a dedicated socket
      between the client and the server, correct? So you established a
      connection, with which the client can send the data to the server and the
      server can send data back to the client. Correct. So there can be,
      depending on the use case, multiple things. For example, let's say it's a
      chatting application, then there'll be another client, correct? So there'll
      be another client, client two, correct? Because you're sending a message to
      me. So now, whatever socket we have, we will have a socket connection here
      as well. So we have a dedicated connection — let's say we call this
      connection one, okay? So this particular thing is connection one, and
      whatever this is that we have is connection two, correct? So both are
      primarily interacting with the server. And whenever you receive a message
      from this particular client, correct — let me just colour it. So you get a
      message from this client to this server, and then you're going to send this
      to this one, correct? And then when they send back, you're going to send it
      back immediately to here, correct? And like you told, it's a pub/sub model
      where the client is always waiting for something to happen. So the client
      will get the most updated information whenever there is a change; basically
      it will be getting that new message and we will be showing that. Correct,
      Sumit? Tell me the disadvantages of using web sockets.

  - t: "00:06:20"
    role: candidate
    text: "I think with web sockets, there can be loss of data."

  - t: "00:06:24"
    role: interviewer
    text: >-
      No, there will not be loss of data. That's not the thing. At a high level
