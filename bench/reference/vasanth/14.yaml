      one. TCP is one protocol, correct? Like that, what other protocols exist?
      UDP is there.

  - t: "00:06:47"
    role: candidate
    text: HTTPS.

  - t: "00:06:48"
    role: interviewer
    text: "In this case, if you have to use a protocol, which protocol will you use?"

  - t: "00:06:52"
    role: candidate
    text: >-
      HTTPS cannot come, because HTTPS is not continuous, it's not bidirectional,
      I think. And web socket, I think, uses UDP.

  - t: "00:07:05"
    role: interviewer
    text: "You're guessing, right, Sumit? Yeah. Sure, no problem. Okay."

  - t: "00:07:11"
    role: candidate
    text: "Yeah. So I never worked with web sockets and all that chat and all that."

  - t: "00:07:14"
    role: interviewer
    romanized: true
    restitched: true
    text: >-
