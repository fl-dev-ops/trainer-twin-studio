    text: >-
      Reconciliation. So as we know, in React, what will happen — React uses the
      virtual DOM concept. And the virtual DOM is already in sync with the real
      DOM, okay? And that real thing is called reconciliation. So to sync your
      virtual DOM with the real DOM, that's reconciliation, okay? Now this
      involves two things: one thing is the virtual DOM, and there is another
      thing called the diffing algorithm. Okay, so what is the diffing algorithm?
      The diffing algorithm is basically a method which will do — whenever we make
      some changes, a new virtual DOM gets created. So now what it will do, it will
      compare with the old virtual DOM, then it will figure out okay, what are the
      minimum steps I need so that I can convert from my old virtual DOM to the
      new virtual DOM. That's the diffing algorithm, and yeah, the whole process is
      called reconciliation.

  - t: "00:24:25"
