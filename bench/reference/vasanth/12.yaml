      whether the token is valid or not next time whenever I open the website?

  - t: "00:06:21"
    role: candidate
    text: >-
      So in that condition, actually, that is why I just told you about that
      pre-flight or XHR mode, right? So every time when I open...

  - t: "00:06:27"
    role: interviewer
    text: >-
      Mode, right? So every time when I open, you make an API call with that, to
      check whether it is valid or not. Okay.

  - t: "00:06:35"
    role: candidate
    text: >-
      And we are also using some interceptors in our Angular application, or in
      the entire application. So that is going to make the pre-flight mode XHR
      call, and then it is checking there itself whether that is available or not.
      So we can just extend our expiry time from the front end side, not the back
      end always.

  - t: "00:06:57"
    role: interviewer
    romanized: true
    text: >-
