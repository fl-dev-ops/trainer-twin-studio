      not be available there. But in the case of local storage, if I close my
      system as well and the entire Google Chrome as well, still my storage,
      whatever the data I have stored, it will be available there. Even if I come
      and log in again, my data will be there.

  - t: "00:08:44"
    role: interviewer
    text: >-
