  - t: "00:00:25"
    role: interviewer
    text: >-
      And without wasting further time, let's get started. Kriti, if you can
      introduce yourself.

  - t: "00:00:30"
    role: candidate
    text: >-
      Yeah, sure. So I have a total of seven point one years of experience, and
      totally I'm working in the Angular framework. I started from Angular two and
      right now it's Angular eleven. Apart from this, I'm working in the banking
      domain and leading the team as well. And I have sorts of knowledge in
      JavaScript and Node.js apart from Angular.

  - t: "00:00:52"
    role: interviewer
    restitched: true
    text: >-
      Wonderful. Wonderful, Kriti. Kriti, let me start by asking a very simple
      question, okay? So in an Angular application, I'm very sure you might have
      built something for the authentication flow, correct? I'll ask you only two
      flows — whether you built it or not, it's a very common interview question.
      A user logs in to your website, and after login, basically next time, let's
      say they close the tab and open it next time, definitely we'll not ask them
      to log in again. The same way Facebook, YouTube, Instagram, everything works
      — as long as you're logged in to the application you continue to be logged
      in, correct? Can you just explain to me this entire authentication flow,
      Kriti? How will we achieve this? Would you like to draw the basic
      architecture here?

  - t: "00:01:40"
    role: candidate
    text: >-
      So suppose that this is the page where I am creating a login page basically.
      Yes, it's a login here.

  - t: "00:01:49"
    role: interviewer
    text: >-
      That is fine, yeah. And I'm primarily interested in the different elements
      that would interact — like you told me, the caching, the back end. I'm
      interested in which all systems interact and how they interact.

  - t: "00:01:59"
    role: candidate
    restitched: true
    text: >-
      So from here we are just making some data go to our caching component, the
      cache controller. And it is not simply like that, because whenever we are
      passing some data from this component we are also using salt encryption
      there. So we are encrypting our passwords. And that password we are loading
      into our cache system, and in the cache system we have some token expiration
      session as well. So I'll provide some token here, with some timeline. Once it
      has passed the cache, it will go to my server side. So the server will have
      to validate whether the token is valid or not, whether expiration is there or
      not. So that cache will store there. So suppose the second time again I am
      coming to my login page, and since that time I don't have a cache, right? So
      before sending my data directly to the server through my browser, it will
      first go and check in the cache whether the data is available there or not.
      So it will not repeatedly call the server API again and again. So it will
      stop here itself. If that is, suppose, expired, it doesn't mean that it will
      again call the server because it's expired — then it will just try to give
      some pre-flight XHR to this guy. Pre-flight. So this pre-flight access token,
      it will just try to knock the door on the server side, whether the data is
      available with you or not. So it will again — because this data is directly
      integrated with the cache system as well, the server will respond to this
      cache system, and from here, as we are using Google Chrome or the V8 engine,
      it will directly interact with this cache only. So it will not go to the
      server directly. That's how we are handling it.

  - t: "00:04:00"
    role: interviewer
    romanized: true
    restitched: true
    text: >-
      Sure. So Kriti, I'll try to summarise, okay? So we have a website, okay? And
      whenever a user tries to log in — let's say this is a login button — as soon
      as they log in, what we are doing is, we are making an API call, getting the
      user information, correct? And let's say you are getting some token; that
      token you are storing in the cache system, correct? So this is the cache
      where you are storing, okay? So you are storing this cache. So next time,
      let's say the user has closed the tab and opens the tab next time, you will
      check in the cache whether the token is available. If the token is available,
      then you will take the user directly to the home screen. Correct? Home is
      just an indicator here, like wherever the core of your application is.
      Correct? So there you will take the user, whenever you have a valid token.
      Correct? Let's say the token is expired. Whenever the token is expired, you
      will make an API call. Am I right? Like the pre-flight you took. You make an
      API call — here is the server. Correct? So here is the server, where we will
      make an API call, get the token back. Once you get the token back, you are
      again going to store that in the cache and the process repeats. Correct? So
      Kriti, let us understand, or elaborate — if you want to add any more points,
      you can add.

  - t: "00:05:16"
    role: candidate
    restitched: true
    text: >-
      If again I am getting the token, that will be matched here itself with
      another service we have created. So we will just check if the token is
      available from the state management or not, and we are only updating our
      expiry date or expiry time. So we know that the token is already available
      for the entire system. That's how it continues.

  - t: "00:05:42"
    role: interviewer
    restitched: true
    text: >-
      Okay, sure. I'll summarise quickly again, Kriti. So I, as a user, came to
      your website. I clicked, I entered my email ID, password, I clicked on login.
