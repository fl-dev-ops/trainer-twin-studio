  - t: "00:12:52"
    role: candidate
    text: Right.

  - t: "00:12:52"
    role: interviewer
    text: >-
      Correct. So I'll ask you one simple question around this. I got the
      scenario where you used it. Can't you just use a utility class to do this
      activity? Just a file which will export a function which will obviously do
      post, get, etcetera, and you pass the URL and the parameters in and it will
