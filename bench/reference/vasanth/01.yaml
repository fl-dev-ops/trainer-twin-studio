  - t: "00:13:15"
    role: candidate
    text: Correct, correct.

  - t: "00:13:17"
    role: interviewer
    text: >-
      The purpose I ask this question, Anubhav, is that every efficient technique
      like a higher order component comes with its own complexities. Higher order
      component, useMemo, useCallback — anything that gives you efficiency comes
      with its own set of trade-offs in performance. Correct? So it is good to
      use them only when required. Correct? So I generally ask some practical
      scenarios. Many people say Redux connect. Correct? Redux connect is one of
      the most common usages of the higher order component. But it is not
      something that we want to use — it is inherently something you cannot avoid
