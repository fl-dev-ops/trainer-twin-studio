  - t: "00:12:35"
    role: interviewer
    text: Higher order component you use for making a network call. Am I right?

  - t: "00:12:40"
    role: candidate
    text: Yeah, like that.

  - t: "00:12:41"
    role: interviewer
    text: >-
      Got it. But rather than making the same set of activity in both — just the
      URL and other things might be changed — you have tried creating a higher
