turns:
  - t: "00:00:54"
    role: interviewer
    text: >-
      Hi Anubhav. As you know, I'm Vasanth. Thanks for registering for the mock
      interview. Can I know something about you, Anubhav — whatever you wish to
      share? What are your skill sets? What sort of interview, which companies
      are you aspiring for at the moment?

  - t: "00:01:24"
    role: candidate
    text: >-
      So I have a total of four years of experience as a full stack developer,
      and the tech stacks that I work on mostly include JavaScript, React, HTML,
      CSS on the front end, and on the back end I usually work with Node.js. And
      the companies that I'm targeting — basically I'm looking forward to joining
      some big product-based companies.

  - t: "00:01:48"
    role: interviewer
    text: >-
      Good, good. Since you are aspiring for big companies, it is good you take
      some serious mock interviews like this so that you get the end-to-end
      preparation practice. Sure, Anubhav. Let's get started with extreme
      fundamentals. This is something that I generally ask at the beginning of
      the interview. JavaScript is a single-threaded interpreted programming
      language. Am I right or wrong, Anubhav?

  - t: "00:02:10"
    role: candidate
    text: Yeah, that is correct.

  - t: "00:02:12"
    role: interviewer
    text: Correct. So can you tell me what is interpretation in general?

  - t: "00:02:16"
    role: candidate
    romanized: true
    text: >-
      So interpretation is like, one by one, each line of code will get executed
      and then you will receive the output.

  - t: "00:02:24"
    role: interviewer
    text: >-
      Exactly, absolutely right. So can you tell me any interpreted language
      example other than JavaScript?

  - t: "00:02:32"
    role: candidate
    text: I think C. C was interpreted — not sure.

  - t: "00:02:36"
    role: interviewer
    text: >-
      C is compiled. C, Java, C# — all are compiled. No problem. So now, if
      JavaScript is interpreted, line-by-line execution happens. In general, do
      you know how JavaScript code is executed — the execution context and those
      things? Can you please elaborate a little bit?

  - t: "00:02:58"
    role: candidate
    restitched: true
    text: >-
      So we have this main stack wherein all the statements that we have written
      in JavaScript are brought in, and then we get the output basically on the
      terminal or browser, wherever we want to see the output. And basically the
      event loop is the concept behind all this, which helps in managing and
      allocating different tasks in the different queues that we have — we have
      the microtask queue as well as another queue for web APIs. So all of this
      is managed: if we have promises, it will be put in the microtask queue; if
      we have a web API like setTimeout, it is placed in a different queue; and
      if we have a console.log statement, they are directly executed on the
      stack, and the rest are handled asynchronously and then we get the output.

  - t: "00:03:53"
    role: interviewer
    text: >-
      Correct, fine. The event loop concept is fine, Anubhav. I am much more
      interested in the execution context — how the execution context is
      created. Let's say you have created a file called one.js. There are some
      functions in it, you are calling the function, you are doing some
      operations. Whenever you run this JavaScript on the browser, what all
      operations take place? Can you please try explaining that? First, what
      happens whenever the browser encounters it?

  - t: "00:04:22"
    role: candidate
    text: >-
      So from the first instance, there are two steps in which JavaScript
      handles the execution of the code. The first is it will check the
      different functions and whatever variables are there, so it will try to
      create that context. And from the second time it will basically go over
      those values and all those things and then give us the output. That's from
      a high level.

  - t: "00:04:49"
    role: interviewer
    text: >-
      True, true, true. What you said is absolutely right. This is a two-step
      execution that JavaScript takes. So now my question is: you say
      interpretation is line-by-line execution, correct? So if line-by-line
      execution is happening, but the execution is happening in two steps, then
      they're contradicting each other, correct? So that's not line-by-line
      execution. Can you justify how line-by-line execution happens in this
      two-step execution process?

  - t: "00:05:16"
    role: candidate
    text: >-
      I will say it is kind of a just-in-time compilation that basically runs
      behind, with which JavaScript is basically able to give us the output.
      And... yeah, I will have to read more about it, I think.

  - t: "00:05:35"
    role: interviewer
    text: Sure, no problem. So you think React is a just-in-time compilation?

  - t: "00:05:40"
    role: candidate
    text: >-
      Oh yeah, it's kind of a library of JavaScript, though it has a number of
      more concepts as well.

  - t: "00:05:50"
    role: interviewer
    text: >-
      Got it. So tell me the difference between just-in-time compilation and
      ahead-of-time compilation. Also, if you know, please tell me which popular
      framework uses ahead-of-time compilation.

  - t: "00:06:08"
    role: candidate
    text: I'm not very sure of ahead-of-time.

  - t: "00:06:10"
    role: interviewer
    text: >-
      No problem. The purpose I ask all these in the beginning is, these are
      extreme fundamentals, correct? You are able to answer most of them, and
      wherever you think you are not so confident, please touch base on those.
      Now, let me ask you a few basic questions, another continuation of
      JavaScript only. Can you tell me what are closures in JavaScript?

  - t: "00:06:31"
    role: candidate
    text: >-
      So closures are basically kind of functions in JavaScript which help the
      inner function to have more control over the context of the outer function
      as well — like you can have a certain variable which you can control with
      the help of the inner function.

  - t: "00:06:49"
    role: interviewer
    romanized: true
    text: It's not wrong, but not fully correct. Do you want to rephrase, Anubhav?

  - t: "00:06:57"
    role: candidate
    text: >-
      Like controlling the scope, I would say. That is what makes more sense.
      Inner functions have more access to the scope of outer functions.

  - t: "00:07:07"
    role: interviewer
    text: >-
      Correct, correct. This definition is fine. So basically inner functions
      have access to the lexical environment of the outer function. If there is
      no outer function, the global itself is the outer function. Correct? That
      is called closure. Can you tell me one practical example where you might
      use closures? Obviously in interviews there are many questions people ask —
      setTimeout and all those things. Any practical example that you think
      where closures can be used?

  - t: "00:07:39"
    role: candidate
    text: >-
      A basic application is, for example, you want to keep the value in check
      for all the different function calls that we have for some sort of
      variable. But in practical terms, if it is used somewhere, I will have to
      check upon it.

  - t: "00:08:01"
    role: interviewer
    text: >-
      Sure, sure. Function caching is one of the good and efficient examples of
      using closures — how to cache a function with a variable number of
      arguments. Obviously there are a lot of other examples too where
      practically we can use closures. So, I'll ask you just a couple of
      questions on React, then we'll solve some snippets. Tell me, what is
      reconciliation in React?

  - t: "00:08:29"
    role: candidate
    restitched: true
    text: >-
      So reconciliation is kind of the mechanism with which React basically does
      the re-rendering. It uses certain algorithms, it compares the different —
      because it creates a tree kind of structure, like the DOM elements we have,
      the tree structure — and the different nodes, they try to compare basically
      what was previously being rendered and what is the new set of structure in
      the virtual DOM. So they kind of compare it and then render only those
      certain nodes which need to be re-rendered or which have a certain kind of
      change.

  - t: "00:09:04"
    role: interviewer
    text: >-
      Exactly. Can you tell me which algorithm is used for this tree comparison?
      As you might know, tree comparison is a very costly operation, correct?
      Can you tell me which algorithm is used for this comparison?

  - t: "00:09:14"
    role: candidate
    text: I think it is diffing, something — diffing.

  - t: "00:09:16"
    role: interviewer
    text: >-
      Correct. Diffing is the algorithm name. Absolutely right. I have one
      practical question, Anubhav. Think and answer. Let's say you have plain
      HTML and JavaScript code written — for example, just an input box and a
      button, nothing much. The same code is written in React as well. As React
      proposes the concept of reconciliation and it technically says it is faster
      than plain JavaScript, so people should basically use it. You tell me
      whether React is faster than vanilla JavaScript in all the scenarios or
      not.

  - t: "00:09:52"
    role: candidate
    text: >-
      So I think there might be certain scenarios where React won't be faster,
      because it does some kind of unnecessary rendering at times as well,
      depending upon the structure we have created in our file — like if we have
      a parent or child kind of thing. So we have to enhance it step by step, and
      so JavaScript might have an edge at times. Not necessarily, and we can
      prevent creating React components.

  - t: "00:10:22"
    role: interviewer
    text: >-
      Got it. So the answer is right, but what an interviewer will generally
      expect is that you should tell an exact scenario, correct? Where JavaScript
      is faster than React. Please check certain scenarios. Your answer is right,
      but it can be right only when you justify it. Tell me, what are higher
      order components in React?

  - t: "00:10:44"
    role: candidate
    text: >-
      Higher order components are kind of created in order to reduce the
      redundancy which might be there in certain kinds of components that we have
      created, and in order to prevent that effort we create a component which
      has a certain set of execution being handled at the higher level, and we
      pass our component to it so that it basically doesn't alter the thing but
      it adds certain kinds of things to that particular component that we are
      passing.

  - t: "00:11:13"
    role: interviewer
    text: >-
      Give me one practical example, Anubhav. Don't give me any built-in
      examples — a practical example where you created a higher order component.

  - t: "00:11:21"
    role: candidate
    romanized: true
    restitched: true
    text: >-
      So I had one scenario with ref forwarding. Basically I was using
      forwardRef, and there I passed it to a higher order component. I wanted, I
