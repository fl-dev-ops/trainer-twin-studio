# other person's echo onto the end of a turn (for example the interviewer's
# "Cuvette? Can you spell it?" sits inside the candidate entry at 00:02:29),
# so every turn below was still attributed and split by content.
raw_speaker_ids:
  interviewer: [1]
  candidate: [2]

invariants:
